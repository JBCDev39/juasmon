<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JUASmon</title>
<meta name="theme-color" content="#e3350d">
<meta name="description" content="Trivia de los juegos de Pokémon para jugar entre amigos.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JUASmon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE  occasion: a couch game between two lifelong fans, soft and lively
   IDEA   a handheld game: title screen with a pixel landscape, cartridges as the menu, the battle HUD in play
   PICTURE a 320x180 pixel scene scaled crisp; in play, the question drawn as a battle with two panels and a route
   COLOUR battle-grass greens, sky blue, white boxes, red for Rojo, blue for Azul, yellow accent
   TYPE   Press Start 2P for labels, numbers and the wordmark + Rubik for reading
   LAYOUT title centred over the scene; menu as a grid of cartridges; play: HUD, stage, menu box; phone stacks */
:root{color-scheme:light dark;--bg:light-dark(#cfe8b9,#0f1d14);--field:light-dark(#b9dc9f,#1a3324);--box:light-dark(#ffffff,#1b2420);--ink:light-dark(#1d2321,#eef3ec);--soft:light-dark(#56615b,#a9b7ae);--line:light-dark(#5c8f6a,#4f8a63);--red:#e3350d;--redd:#a3230a;--blue:#2f6fdb;--yellow:#ffcb05;--ok:#2e9e4f;--bad:#d7263d;
--sky1:light-dark(#6ec3ef,#0b1733);--sky2:light-dark(#d9f2ff,#2a3d6b);--h1:light-dark(#a6d98f,#244a3a);--h2:light-dark(#77bb5f,#1d3d2b);--h3:light-dark(#4f9a44,#163223);--gr:light-dark(#3f8a3a,#11281b);--tuft:light-dark(#2c6a2a,#0b1d13);--cloud:light-dark(#ffffff,#8796b8);--cloud2:light-dark(#d6ecf8,#5f6e92);--sun:light-dark(#fff3a6,#f2f0d6);--star:light-dark(transparent,#f6f3c9);--vol:light-dark(#7f9a86,#2a3d3a);--vol2:light-dark(#c9d6cf,#4a5c58);--smoke:light-dark(#eef2f0,#6b7a80);--leaf:light-dark(#2f7d3a,#163b22);--leaf2:light-dark(#22612c,#0f2a18);--leaf3:light-dark(#469a46,#1f4a2c);--trunk:light-dark(#5a3d24,#33241a)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Rubik,system-ui,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.px{font-family:"Press Start 2P",monospace;letter-spacing:0;line-height:1.5}
#app{min-height:100%;display:flex;flex-direction:column}
.still *:not(.keep){animation:none!important}

/* escena pixelada */
.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.drift{animation:drift linear infinite}
.sway{animation:sway 2.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.twinkle{animation:blink 2.4s steps(2) infinite}

/* pantalla de título */
.title{position:relative;flex:1;min-height:100%;display:grid;place-items:center;overflow:hidden;cursor:pointer;padding:24px 16px}
.wordmark{position:relative;text-align:center;display:grid;gap:14px;justify-items:center;margin-bottom:12vh;animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.wm1{font-size:clamp(14px,2.4vw,20px);color:var(--yellow);text-shadow:3px 3px 0 #1d2321}
.wm2{font-size:clamp(30px,8.2vw,78px);line-height:1.1;color:#fff;text-shadow:0 4px 0 var(--red),0 8px 0 #1d2321;animation:float 3.2s ease-in-out infinite}
.wm3{font-size:clamp(10px,1.6vw,13px);color:#fff;text-shadow:2px 2px 0 #1d2321}
.press{position:absolute;bottom:13vh;left:0;right:0;text-align:center;display:grid;gap:10px}
.press b{font:clamp(12px,2.2vw,16px) "Press Start 2P",monospace;color:#fff;text-shadow:3px 3px 0 #1d2321;animation:blink 1.1s steps(2) infinite}
.press span{font-size:13px;color:#fff;text-shadow:1px 1px 0 #1d2321}

/* menú de cartuchos */
.menu-screen{position:relative;flex:1;overflow-x:clip}
.menu-screen .scene{opacity:.55}
.menu-inner{position:relative;max-width:980px;margin:0 auto;padding:clamp(18px,4vw,40px) max(16px,3vw) 40px;display:grid;gap:22px}
.mini-wm{justify-self:start;background:none;border:0;padding:0;color:#fff;text-shadow:0 3px 0 var(--red),0 6px 0 #1d2321;font:clamp(16px,3vw,24px) "Press Start 2P",monospace}
.carts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.cart{--cc:var(--red);position:relative;text-align:start;display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;align-items:center;padding:30px 20px 18px;border:3px solid #1d2321;border-radius:10px 10px 6px 6px;background:light-dark(#d9dde0,#3a4148);color:#1d2321;clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,0 100%);box-shadow:0 6px 0 rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s;animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
.cart::before{content:"";position:absolute;left:18px;right:44px;top:9px;height:10px;background:repeating-linear-gradient(90deg,rgba(0,0,0,.28) 0 3px,transparent 3px 9px);border-radius:3px}
.cart:hover,.cart:focus-visible{transform:translateY(-6px);box-shadow:0 12px 0 rgba(0,0,0,.22)}
.cart:active{transform:translateY(-1px)}
.cart:focus-visible{outline:3px solid var(--yellow);outline-offset:3px}
.cart .ico{grid-row:span 2;width:64px;height:64px;border-radius:8px;background:var(--cc);display:grid;place-items:center;border:3px solid #1d2321}
.cart .ico svg{width:40px;height:40px}
.cart .ct{font:clamp(12px,1.8vw,15px) "Press Start 2P",monospace;color:#1d2321}
.cart .cd{font-size:15px;color:#3b4440}
.cart.wide{grid-column:1/-1;--cc:var(--yellow)}

/* barra de combate (en partida) y barra de pantallas */
.hud{position:relative;background:linear-gradient(180deg,var(--red),#c92c0b);color:#fff;padding:10px max(16px,3vw) 16px;box-shadow:inset 0 -4px 0 var(--redd)}
.hud::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(90deg,var(--redd) 50%,transparent 0) 0 0/16px 8px;opacity:.9}
.topline{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{background:none;border:0;padding:6px 0;color:#fff;font:12px "Press Start 2P",monospace;text-shadow:2px 2px 0 var(--redd)}
.tools{display:flex;gap:8px}
.ibtn{display:inline-flex;align-items:center;gap:8px;min-height:40px;min-width:40px;justify-content:center;padding:6px 12px;border-radius:10px;border:2px solid #fff;background:rgba(0,0,0,.18);color:#fff;font:10px "Press Start 2P",monospace;transition:background .2s,transform .2s}
.ibtn:hover{background:rgba(0,0,0,.32)}
.ibtn:active{transform:scale(.95)}
.ibtn svg{width:18px;height:18px}
.hudrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:center;margin-top:10px}
.hudrow.many{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.hudrow.many .center{grid-column:1/-1;order:-1}
.hudrow.solo{grid-template-columns:minmax(0,1fr) minmax(0,1.4fr)}
.panel{position:relative;background:var(--box);color:var(--ink);border:3px solid #1d2321;border-radius:12px 4px 12px 4px;padding:8px 12px 10px;display:grid;gap:4px;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.panel.on{transform:translateY(-4px);box-shadow:0 7px 0 rgba(0,0,0,.25),0 0 0 3px var(--yellow)}
.panel .pn{display:flex;align-items:center;gap:8px;font-weight:700;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.panel .pn i{flex:none;width:12px;height:12px;border-radius:3px;background:var(--c)}
.panel .pn em{margin-left:auto;font:9px "Press Start 2P",monospace;color:var(--c);font-style:normal;opacity:0;transition:opacity .3s}
.panel.on .pn em{opacity:1}
.panel .ps{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.panel .pts{font:18px "Press Start 2P",monospace;display:inline-block}
.panel .pa{font-size:12px;color:var(--soft);white-space:nowrap}
.bump{animation:bump .5s cubic-bezier(.2,.8,.2,1)}
.center{display:grid;gap:6px;justify-items:center;text-align:center}
.route{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px}
.seg{display:grid;gap:4px;justify-items:center}
.seg .sl{font:8px "Press Start 2P",monospace;opacity:.85}
.seg.cur .sl{opacity:1;color:var(--yellow)}
.dots{display:flex;gap:4px}
.dots i{width:10px;height:10px;border-radius:2px;background:rgba(255,255,255,.28);border:2px solid rgba(0,0,0,.25);transition:background .3s}
.dots i.ok{background:#6fe08e}.dots i.bad{background:#ffb4b4}.dots i.mid{background:#ffe27a}
.dots i.now{background:var(--yellow);animation:pulse 1s ease-in-out infinite}
.lives{display:flex;gap:8px;justify-content:center}
.lives svg{width:24px;height:24px;transition:transform .3s,opacity .3s}
.lives svg.lost{opacity:.3;transform:scale(.8)}
.cline{font:10px "Press Start 2P",monospace}
.tbig{font:22px "Press Start 2P",monospace}
.hudbar{width:min(260px,100%);height:12px;border-radius:99px;border:2px solid #1d2321;background:rgba(255,255,255,.35);overflow:hidden}
.hudbar>i{display:block;height:100%;width:var(--w);background:var(--hc,#6fe08e)}
.screen-head{display:flex;align-items:center;gap:14px}
.screen-head h1{margin:0;font-size:13px}

/* contenido */
main{flex:1;width:100%;max-width:980px;margin:0 auto;padding:clamp(18px,3vw,32px) max(16px,3vw);display:flex;flex-direction:column;gap:18px}
.enter{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
.box{background:var(--box);border:3px solid var(--ink);border-radius:14px;box-shadow:inset 0 0 0 3px var(--box),inset 0 0 0 6px var(--line);padding:22px 24px}
.meta{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;font-size:10px;color:var(--soft)}
.turn{display:inline-flex;align-items:center;gap:10px;font-size:11px;padding:8px 12px;border-radius:8px;background:var(--c);color:#fff}
h2{font-size:clamp(17px,3vw,22px);margin:0 0 10px;line-height:1.35}
.q{font-size:clamp(19px,2.6vw,24px);font-weight:500;line-height:1.35;margin:0;text-wrap:balance}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{position:relative;text-align:start;min-height:56px;padding:12px 14px 12px 42px;border-radius:10px;border:2px solid var(--ink);background:var(--box);font-weight:500;transition:transform .18s,background .18s,box-shadow .18s;animation:rise .4s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 50ms + 120ms)}
.opt::before{content:attr(data-k);position:absolute;left:12px;top:50%;transform:translateY(-50%);font:10px "Press Start 2P",monospace;color:var(--soft)}
.opt::after{content:"▶";position:absolute;left:12px;top:50%;transform:translate(-6px,-50%);opacity:0;font-size:12px;transition:opacity .15s,transform .15s}
.opt:hover:not(:disabled){background:color-mix(in srgb,var(--yellow) 28%,var(--box));transform:translateX(3px)}
.opt:hover:not(:disabled)::before{opacity:0}
.opt:hover:not(:disabled)::after{opacity:1;transform:translate(0,-50%)}
.opt:focus-visible,.btn:focus-visible,.tog:focus-visible,.ibtn:focus-visible,.brand:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.opt.right{background:var(--ok);color:#fff;border-color:var(--ok);animation:pulse-ok .6s ease-out}
.opt.wrong{background:var(--bad);color:#fff;border-color:var(--bad);animation:shake .45s}
.opt.right::before,.opt.wrong::before{color:#fff}
.opt:disabled{cursor:default}
.btn{min-height:48px;padding:12px 20px;border-radius:10px;border:2px solid var(--ink);background:var(--yellow);color:#1d2321;font:11px "Press Start 2P",monospace;box-shadow:0 4px 0 var(--ink);transition:transform .15s,box-shadow .15s}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--box);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.end{justify-content:flex-end}
.between{justify-content:space-between}
.vs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:14px;align-items:center}
.card{background:var(--box);border:3px solid var(--ink);border-radius:14px;padding:16px 18px;display:grid;gap:8px}
.from-l{animation:from-l .55s cubic-bezier(.2,.8,.2,1) both}
.from-r{animation:from-r .55s cubic-bezier(.2,.8,.2,1) .08s both}
.dex{font-size:11px;color:var(--soft)}
.name{font-size:clamp(20px,3vw,26px);font-weight:700;line-height:1.15;overflow-wrap:anywhere}
.types{display:flex;flex-wrap:wrap;gap:6px}
.type{font-size:13px;font-weight:700;padding:2px 10px;border-radius:99px;background:var(--t);color:var(--ti,#fff)}
.val{font-size:clamp(20px,4vw,28px)}
.val.reveal{animation:pop .45s cubic-bezier(.2,.8,.2,1.4)}
.hp{height:12px;border-radius:99px;background:light-dark(#e3e8e4,#2b3631);border:2px solid var(--ink);overflow:hidden}
.hp>i{display:block;height:100%;width:var(--w);background:var(--hc,var(--ok));transition:width .9s cubic-bezier(.2,.8,.2,1),background .4s}
.vsmark{font-size:16px;color:var(--red);animation:pop .5s .3s both}
.clues{display:grid;gap:10px}
.clue{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:4px 14px;align-items:baseline;padding:12px 16px;border-radius:12px;background:var(--field)}
.clue.pop{animation:pop .4s cubic-bezier(.2,.8,.2,1.3)}
.clue .l{font-size:10px;color:var(--soft)}
.clue .t{font-size:clamp(22px,4vw,32px);font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.clue .s{grid-column:2;color:var(--soft);font-size:15px}
.input{width:100%;min-height:48px;padding:10px 14px;border-radius:10px;border:2px solid var(--ink);background:var(--box);font-size:17px}
.verdict{font-size:14px;min-height:1.5em;margin:0 0 6px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.result{animation:slide-up .4s cubic-bezier(.2,.8,.2,1) both}
.timer{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;font-size:10px}
.setup{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.field{display:grid;gap:8px;align-content:start}
.field>.l{font-size:10px}
.togs{display:flex;flex-wrap:wrap;gap:8px}
.tog{min-height:44px;min-width:44px;padding:8px 14px;border-radius:10px;border:2px solid var(--ink);background:var(--box);font-weight:500;transition:background .2s,color .2s,transform .15s}
.tog:active{transform:scale(.96)}
.tog[aria-pressed=true]{background:var(--ink);color:var(--box)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.mode{text-align:start;display:grid;gap:6px;padding:16px;border-radius:12px;border:3px solid var(--ink);background:var(--box);transition:transform .2s,box-shadow .2s}
.mode[aria-pressed=true]{background:var(--ink);color:var(--box);box-shadow:0 0 0 4px var(--yellow)}
.mode:hover{transform:translateY(-3px)}
.mode b{font:12px "Press Start 2P",monospace}
.mode span{font-size:14px;opacity:.85}
.mode small{font-size:12px;opacity:.75}
.hint{font-size:14px;color:var(--soft);margin:0}
.big{font-size:clamp(22px,5vw,36px);margin:0}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:2px solid var(--field);text-align:right}
th:first-child,td:first-child{text-align:left}
.scroll{overflow-x:auto}
.list{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.list li{display:flex;gap:10px;justify-content:space-between;align-items:center;padding:10px 12px;border-radius:10px;background:var(--field)}
.full{grid-column:1/-1}
.newrec{display:inline-block;font-size:11px;padding:6px 10px;border-radius:8px;background:var(--yellow);color:#1d2321;animation:pop .5s .4s both}

/* ventanas: pausa y confirmación */
.veil{position:fixed;inset:0;z-index:20;background:rgba(10,20,14,.55);display:grid;place-items:center;padding:16px;animation:fade .25s both}
.dialog{width:min(460px,100%);max-height:calc(100% - 32px);overflow:auto;animation:pop .3s cubic-bezier(.2,.8,.2,1.2) both}
.dlist{display:grid;gap:6px;margin-top:8px}
.ditem{position:relative;text-align:start;padding:12px 14px 12px 36px;border-radius:10px;border:0;background:transparent;font:12px "Press Start 2P",monospace;color:var(--ink);transition:background .15s}
.ditem::before{content:"▶";position:absolute;left:12px;opacity:0;transition:opacity .15s,transform .15s;transform:translateX(-4px)}
.ditem:hover,.ditem:focus-visible{background:var(--field);outline:none}
.ditem:hover::before,.ditem:focus-visible::before{opacity:1;transform:none}
.ditem.danger{color:var(--bad)}

/* transición de ronda */
.wipe{position:fixed;inset:0;z-index:80;pointer-events:all;display:grid;grid-template-rows:repeat(8,1fr)}
.wipe i{background:#1d2321;transform-origin:left;transform:scaleX(0)}
.wipe.closing i{animation:wclose .32s cubic-bezier(.7,0,.3,1) both;animation-delay:calc(var(--i) * 14ms)}
.wipe.opening i{transform:scaleX(1);animation:wopen .38s cubic-bezier(.7,0,.3,1) both;animation-delay:calc(var(--i) * 18ms)}
@keyframes wclose{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes wopen{from{transform:scaleX(1)}to{transform:scaleX(0)}}
.wipe i:nth-child(even){transform-origin:right;background:var(--red)}

/* confeti pixelado */
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:15}
.confetti i{position:absolute;top:-16px;width:10px;height:10px;background:var(--c);animation:fall var(--d) linear var(--delay) forwards}

@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes slide-up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
@keyframes from-l{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes from-r{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.85)}100%{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
@keyframes pulse-ok{0%{box-shadow:0 0 0 0 rgba(46,158,79,.7)}100%{box-shadow:0 0 0 14px rgba(46,158,79,0)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.45);color:var(--ok)}100%{transform:scale(1)}}
@keyframes blink{0%{opacity:1}50%{opacity:0}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(400px)}}
@keyframes sway{from{transform:skewX(-6deg)}to{transform:skewX(6deg)}}
@keyframes wipe{0%{transform:scaleX(0)}45%,55%{transform:scaleX(1)}100%{transform:scaleX(0)}}
@keyframes fall{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(110vh) rotate(540deg)}}


/* formatos nuevos */
.catl{font-size:10px}
.types.inline{display:inline-flex;vertical-align:middle;gap:4px}
.q .type,.hint .type,.answer .type,.olist .type{font-size:.8em;vertical-align:.08em}
.answer{margin:2px 0 8px;font-weight:500}
.verdict.mid{color:#c98a00}
.opt.tall{min-height:72px;font-size:19px;text-align:center;padding-left:14px}
.opt.tall::before,.opt.tall::after{display:none}
.opt.check{padding-left:46px}
.opt.check::before{content:"";width:18px;height:18px;border:2px solid var(--ink);border-radius:5px;background:var(--box);font:0/0 a}
.opt.check.on::before{background:var(--ink);box-shadow:inset 0 0 0 3px var(--box)}
.opt.check:hover:not(:disabled)::before{opacity:1}
.opt.check::after{display:none}
.opt.missed{border:2px dashed var(--ok);color:var(--ok)}
.opt.check.right::before,.opt.check.wrong::before{border-color:#fff;background:#fff;box-shadow:inset 0 0 0 4px currentColor}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

.hubcard .ico svg{width:30px;height:30px}
.hubcard .tt{display:grid;gap:4px}.hubcard b{font-size:11px;font-weight:400}.hubcard .tt>span{font-size:14px;color:#4b5650}.hubcard small{font-size:13px;font-weight:700;color:#2e7d3f}
.hubcard .chev{font-size:18px}.hubcard.done{opacity:.85}.hubcard.done .chev{color:var(--ok)}
.hubcard:active{transform:translateY(3px)}
.tiles .tile .ico svg{width:24px;height:24px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* Pokédle compartible */
.share{white-space:pre-wrap;font:15px/1.4 system-ui,sans-serif;background:var(--field);border-radius:10px;padding:10px 12px;margin:8px 0}
/* Tipo contra tipo */
.tvtq{display:grid;justify-items:center;gap:10px;text-align:center}
.tvtrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.tvtrow .type{font-size:18px;padding:6px 14px}
.tvtvs{font-size:11px;color:var(--red)}
.tvtopts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tvto{padding:14px 6px;text-align:center;font:16px "Press Start 2P",monospace;min-height:64px}
/* Cadena Pokémon */
.cadchips{align-items:center}
.cadchips .arrow{color:var(--soft)}
.chip2.last{animation:lastchip 1.2s ease-out;box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 40%,transparent)}
@keyframes lastchip{0%{transform:scale(.6);opacity:0}40%{transform:scale(1.15);opacity:1}100%{transform:none}}
.cadleg{display:flex;gap:14px;margin:0 0 8px;font-size:13px;color:var(--soft)}
.cadleg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:-1px}
.cadsaid{margin:0 0 4px}.cadsaid b{color:var(--red)}
.cadthink{animation:thinkfade 1.2s ease-in-out infinite}
@keyframes thinkfade{50%{opacity:.55}}
.bigletter{display:inline-grid;place-items:center;min-width:44px;height:44px;border-radius:10px;background:var(--yellow);color:#1d2321;border:2px solid #1d2321;font-size:18px;vertical-align:middle}
/* Ahorcado */
.ahbox{display:grid;gap:10px;justify-items:center;text-align:center}
.ahbox>.row{width:100%}
.ahfig{width:132px;height:132px}
.ahfig .ahnew{animation:ahin .4s steps(4)}
@keyframes ahin{0%{opacity:0}100%{opacity:1}}
.ahfig.ahlost{animation:jitter .4s 2}
.ahword{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 22px;width:100%;container-type:inline-size}
.ahw{display:flex;flex-wrap:nowrap;gap:4px}
.ahword .ahc{width:min(28px,calc((100cqw - (var(--n) - 1) * 4px) / var(--n)));font-size:min(18px,calc((100cqw - (var(--n) - 1) * 4px) / var(--n) * .62))}
.ahc{display:inline-grid;place-items:center;width:28px;height:38px;border-bottom:3px solid var(--ink);font:18px "Press Start 2P",monospace}
.ahc.sep{border-bottom:0}.ahc.miss{color:var(--red)}
.ahkeys{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.ahk{min-height:46px;border-radius:8px;border:2px solid var(--ink);background:var(--box);color:var(--ink);font:13px "Press Start 2P",monospace}
.ahk.hit{background:var(--ok);color:#fff}.ahk.no{background:var(--soft);color:var(--box);opacity:.5}
/* Casino Azulona */
.chipbar{display:flex;align-items:center;gap:8px;justify-self:start;align-self:flex-start;background:#1d2321;color:#ffcb05;border:2px solid #ffcb05;border-radius:99px;padding:6px 14px 6px 8px}
.chipbar b{font-size:14px}.chipbar .hint{color:#fff}
.coin{width:22px;height:22px}
.casgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.castile{position:relative;display:grid;gap:8px;align-content:start;text-align:start;min-height:130px;padding:14px;border-radius:14px;border:3px solid #1d2321;background:var(--cc);color:#fff;box-shadow:0 5px 0 #1d2321;animation:rise .45s both}
.castile b{font-size:11px;font-weight:400}.castile span{font-size:13.5px}
.castile:active{transform:translateY(3px)}
.pcards{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pcard{display:flex;justify-content:space-between;align-items:center;gap:8px;min-width:0;padding:8px 10px;border-radius:10px;border:2px solid var(--ink);background:var(--box)}
.pcard.flip{animation:flipin .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes flipin{0%{transform:perspective(400px) rotateY(90deg);opacity:.4}100%{transform:none;opacity:1}}
.pcard .pname{font-weight:700;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pcard .pval{font-size:13px;color:var(--red);flex:none}
.pcard .types{display:flex;gap:4px;flex-wrap:wrap}
.pcard.back{justify-content:center;min-height:40px;background:repeating-linear-gradient(45deg,#e3350d 0 10px,#c42a08 10px 20px);color:#fff;font-size:14px}
.table21{display:grid;gap:12px}
.status21{margin:0;font-size:17px;font-weight:700;padding:8px 12px;border-radius:10px;background:var(--field)}
.status21.ok{background:color-mix(in srgb,var(--ok) 30%,var(--box))}.status21.bad{background:color-mix(in srgb,var(--bad) 22%,var(--box))}
.side{display:grid;gap:6px}
.sidehead{display:flex;align-items:baseline;gap:8px}.sidehead b{font-size:10px;font-weight:400}
.sidehead .tot{font-size:20px;margin-left:auto}.sidehead .tot.over{color:var(--bad)}.sidehead .tot.exact{color:var(--ok)}
.sbar{height:10px;border:2px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--field)}.sbar i{display:block;height:100%;background:var(--ok);transition:width .5s}
.mcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:6px}
.vsrow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:end}
.vsrow>div{display:grid;gap:4px;min-width:0}
.vsrow .pcard{flex-direction:column;align-items:flex-start}.vsrow .pcard .pname{white-space:normal;overflow-wrap:anywhere}.vsrow .pcard .pval{font-size:16px}
.casino .playbar{justify-content:flex-end}
/* Pokédle con tarjetas */
.pdlegend{display:grid;gap:6px;margin-top:8px;font-size:14px}
.pdlegend span{display:flex;align-items:center;gap:8px}
.sw{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:5px;border:2px solid var(--ink);font-style:normal;font-size:11px;flex:none}
.sw.ok,.pdtile.ok{background:#2e9e4f;color:#fff}.sw.near,.pdtile.near{background:#ffcb05;color:#1d2321}.sw.no,.pdtile.no{background:light-dark(#d7dbd8,#3a4440);color:var(--ink)}.sw.arrow{background:var(--box)}
.pdcards{display:grid;gap:10px}
.pdcard{background:var(--box);border:3px solid var(--ink);border-radius:12px;padding:10px;display:grid;gap:8px;animation:rise .35s both}
.pdtiles{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.pdtile:nth-child(-n+2){grid-column:span 3}.pdtile:nth-child(n+3){grid-column:span 2}
.pdtile{border:2px solid var(--ink);border-radius:8px;padding:5px 3px;display:grid;gap:2px;text-align:center;min-width:0}
.pdtile small{font-size:10px;opacity:.85}.pdtile span{font-size:13px;font-weight:700;line-height:1.2}
.rgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:330px;margin:0 auto}
.rcell{aspect-ratio:1;border-radius:12px;border:3px solid #1d2321;display:grid;place-items:center}
button.rcell{background:repeating-linear-gradient(135deg,#b8b8b8 0 8px,#d0d0d0 8px 16px);font-size:20px;color:#555}
.rcell.open{background:#fff;animation:pop .3s both}.rcell.open svg{width:60%;height:60%}
.rcell.win{background:color-mix(in srgb,var(--yellow) 55%,#fff)}
/* duelos en línea */
.codebox{display:grid;gap:4px;text-align:center}
.bigcode{font-size:clamp(26px,8vw,40px);margin:4px 0 8px;letter-spacing:2px;color:var(--red)}
.codebox .row{justify-content:center}
.lobby{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:center}
.lplayer{display:grid;justify-items:center;gap:8px;text-align:center;min-width:0}
.lplayer span{display:grid;gap:2px;min-width:0}.lplayer b{font-size:11px;overflow-wrap:anywhere}.lplayer small{font-size:12px}
.lplayer.empty .avatar{background:var(--field);border-style:dashed;animation:blink 1.4s steps(2) infinite}
.tog.ro{cursor:default}
.codein{text-transform:uppercase;font-size:16px;letter-spacing:1px}
.waitbox{display:grid;gap:10px;justify-items:center;text-align:center;padding:30px 20px}
.dots{display:flex;gap:8px}.dots i{width:12px;height:12px;background:var(--ink);border-radius:2px;animation:blink 1s steps(2) infinite}.dots i:nth-child(2){animation-delay:.33s}.dots i:nth-child(3){animation-delay:.66s}
.duelres{display:grid;gap:8px}
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.drow .dn{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .dv.ok{color:var(--ok)}.drow .dv.mid{color:#c98a00}.drow .dv.bad{color:var(--bad)}
.drow .dt{color:var(--soft);font-size:14px}.drow b{font-size:12px}
.dbonus{grid-column:1/-1;justify-self:start;font-size:9px;background:var(--yellow);color:#1d2321;border:2px solid #1d2321;border-radius:6px;padding:3px 6px}
.duelscore{display:flex;flex-wrap:wrap;gap:8px}
.duelscore>span{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:99px;border:2px solid var(--c);background:var(--box);font-weight:700}
/* cielo: día o noche de Costa Rica y el clima de San José */
.scene.sky-day{color-scheme:light}.scene.sky-night{color-scheme:dark}
.scene.w-nublado,.scene.w-lluvia,.scene.w-llovizna,.scene.w-tormenta,.scene.w-neblina{--sun:transparent;--star:transparent;--cloud:light-dark(#e3e8ee,#76829e);--cloud2:light-dark(#c4ccd6,#56627c)}
.scene.w-parcial{--cloud2:light-dark(#cfdbe6,#5f6e92)}
.scene .drop{animation:rain linear infinite}
@keyframes rain{from{transform:translate(0,0)}to{transform:translate(-8px,200px)}}
.scene .flash{opacity:0;animation:flash 7s steps(1) infinite}
@keyframes flash{0%,88%,92%,100%{opacity:0}89%,91%{opacity:.55}}
.scene .fogband{animation:fogdrift 18s ease-in-out infinite alternate}
@keyframes fogdrift{from{transform:translateX(-20px)}to{transform:translateX(20px)}}
.scene .blinkl{animation:blink 1.6s steps(2) infinite}
.scene .burst{animation:burst 2.8s ease-out infinite;opacity:0}
@keyframes burst{0%{transform:scale(.2);opacity:0}10%{opacity:1}60%{transform:scale(1);opacity:1}100%{transform:scale(1.15);opacity:0}}
.scene .swing{animation:swing 3s ease-in-out infinite alternate}
@keyframes swing{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
.scene .wave{animation:wave 1.4s steps(2) infinite}
@keyframes wave{50%{transform:skewY(4deg)}}
.scene .confe{animation:rain linear infinite}
.skyline{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:center;background:rgba(29,35,33,.55);color:#fff;border-radius:12px;padding:8px 12px;text-align:center}
.skyline b{font-size:10px;font-weight:400;color:#ffcb05}.skyline span{font-size:13px}
/* volcán, fauna y profundidad */
.scene .smoke{animation:smoke 6.4s ease-out infinite;opacity:0;transform-box:fill-box;transform-origin:50% 100%}
@keyframes smoke{0%{transform:translateY(4px) scale(.6);opacity:0}20%{opacity:.85}100%{transform:translate(1px,-24px) scale(1.5);opacity:0}}
.scene .sloth{animation:sloth 9s ease-in-out infinite alternate}
@keyframes sloth{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.scene .flyby{animation:flyby linear infinite}
.scene .flyby.rev{animation-name:flybyrev}
@keyframes flyby{from{transform:translateX(-30px)}to{transform:translateX(360px)}}
@keyframes flybyrev{from{transform:translateX(360px) scaleX(-1)}to{transform:translateX(-30px) scaleX(-1)}}
.scene .flap{animation:flap .5s steps(2) infinite}
@keyframes flap{50%{transform:translateY(1px)}}
.scene .hover{animation:hover .9s ease-in-out infinite alternate}
@keyframes hover{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.scene .morpho{animation:morpho 14s ease-in-out infinite alternate}
@keyframes morpho{0%{transform:translate(0,0)}25%{transform:translate(14px,-8px)}50%{transform:translate(30px,-2px)}75%{transform:translate(46px,-10px)}100%{transform:translate(60px,-4px)}}
.scene .wings{animation:wings .3s steps(2) infinite;transform-origin:133px 147px}
@keyframes wings{50%{transform:scaleX(.4)}}
.scene .firefly{animation:firefly ease-in-out infinite}
@keyframes firefly{0%,100%{opacity:0;transform:translate(0,0)}50%{opacity:1;transform:translate(3px,-4px)}}
#bg .para{transition:transform .1s linear;will-change:transform}
/* para que todo se sienta vivo */
.tcard .avatar.idlebob{animation:idlebob 6s ease-in-out infinite}
@keyframes idlebob{0%,84%,100%{transform:none}88%{transform:translateY(-6px) rotate(-4deg)}92%{transform:translateY(0) rotate(0)}95%{transform:translateY(-3px)}}
.ico svg.idle-star{animation:twinkle-i 2.6s ease-in-out infinite}
@keyframes twinkle-i{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.15) rotate(12deg)}}
.ico svg.idle-coin{animation:coinspin 3s ease-in-out infinite}
@keyframes coinspin{0%,60%,100%{transform:scaleX(1)}70%{transform:scaleX(.1)}80%{transform:scaleX(1)}90%{transform:scaleX(.1)}}
.ico svg.idle-ring{animation:spin-i 6s linear infinite}
@keyframes spin-i{to{transform:rotate(360deg)}}
.ico svg.idle-dice{animation:dice-i 4s ease-in-out infinite}
@keyframes dice-i{0%,80%,100%{transform:none}84%{transform:rotate(-14deg) translateY(-3px)}88%{transform:rotate(12deg)}92%{transform:rotate(-6deg)}}
.ico svg.idle-pencil{animation:wiggle-i 3.4s ease-in-out infinite;transform-origin:20% 80%}
@keyframes wiggle-i{0%,70%,100%{transform:none}76%{transform:rotate(-12deg)}82%{transform:rotate(10deg)}88%{transform:rotate(-6deg)}}
.ico svg.idle-trophy{animation:shine-i 3s ease-in-out infinite}
@keyframes zap-i{0%,76%,100%{filter:none;transform:none}80%{filter:brightness(1.8);transform:scale(1.12)}84%{filter:none;transform:none}88%{filter:brightness(1.8)}}
.ico svg.idle-zap{animation:zap-i 3.2s steps(1) infinite}
@keyframes ghost-i{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.ico svg.idle-ghost{animation:ghost-i 2.8s ease-in-out infinite}
@keyframes shine-i{0%,70%,100%{filter:none;transform:none}80%{filter:brightness(1.6) drop-shadow(0 0 3px #fff);transform:translateY(-2px)}}
.tile,.bp,.hubcard,.castile,.seg,.preset,.ahk,.contbtn,.tcard,.summary,.opt{transition:transform .32s cubic-bezier(.34,1.56,.64,1),background .2s,box-shadow .2s}
.tile:active,.bp:active,.hubcard:active,.castile:active,.preset:active,.ahk:active,.contbtn:active,.summary:active{transform:scale(.95);transition-duration:.08s}
.opt:active:not(:disabled){transform:scale(.97);transition-duration:.08s}
[data-phase=reveal] .opt:not(.right):not(.wrong){animation:none}
.spark{position:fixed;z-index:60;width:6px;height:6px;pointer-events:none;animation:spark .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes spark{0%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(.2) rotate(180deg);opacity:0}}
.flypts{position:fixed;z-index:60;pointer-events:none;color:var(--ok);font-size:20px;text-shadow:0 2px 0 #1d2321,0 0 8px #fff}
.shakeit{animation:shake .45s}
.celebrate{position:fixed;inset:0;z-index:90;display:grid;place-items:center;background:rgba(10,14,12,.6);animation:celefade .25s both;padding:20px}
.celebox{display:grid;justify-items:center;gap:10px;text-align:center;background:var(--box);border:4px solid #1d2321;border-radius:18px;box-shadow:0 8px 0 #1d2321;padding:26px 24px;max-width:340px;animation:pop .45s cubic-bezier(.34,1.56,.64,1) both}
.celeicon{width:110px;height:110px;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--mc) 35%,transparent),transparent 70%);animation:medalspin 1.6s cubic-bezier(.2,.8,.2,1) both}
.celeicon svg{width:70px;height:70px;filter:drop-shadow(0 3px 0 #1d2321)}
@keyframes medalspin{0%{transform:perspective(400px) rotateY(0) scale(.3)}60%{transform:perspective(400px) rotateY(720deg) scale(1.1)}100%{transform:perspective(400px) rotateY(720deg) scale(1)}}
.celetitle{font-size:13px;color:var(--red)}.celename{font-size:20px;font-weight:700;margin:0}
@keyframes celefade{from{opacity:0}to{opacity:1}}
.confetti.coins i{width:22px;height:22px;background:none;animation-name:coinfall}
.confetti.coins i svg{width:100%;height:100%}
@keyframes coinfall{0%{transform:translateY(0) rotateY(0)}100%{transform:translateY(110vh) rotateY(900deg)}}
.chipbar b.bump{animation:bump .5s}
.typo{margin:4px 0 8px;font-size:15px;color:var(--ink)}.typo b:first-child{color:#e3350d;font-family:'Press Start 2P',monospace;font-size:11px;margin-right:4px}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="app"><main><div class="box"><p class="px" style="font-size:12px">Alistando la Pokédex…</p></div></main></div>
<div id="overlay"></div>
<script type="module" src="js/ui.js"></script>
</body>
</html>
